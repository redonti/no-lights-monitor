name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/redonti/no-lights-monitor
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'cmd/api/**'
              - 'internal/**'
              - 'web/**'
              - 'Dockerfile.api'
              - 'go.mod'
              - 'go.sum'
            worker:
              - 'cmd/worker/**'
              - 'internal/**'
              - 'Dockerfile.worker'
              - 'go.mod'
              - 'go.sum'
            bot:
              - 'cmd/bot/**'
              - 'internal/**'
              - 'Dockerfile.bot'
              - 'go.mod'
              - 'go.sum'
            outage:
              - 'cmd/outage/**'
              - 'internal/**'
              - 'Dockerfile.outage'
              - 'go.mod'
              - 'go.sum'
            graph-service:
              - 'graph-service/**'
            dtek:
              - 'dtek-service/**'

  # Builds one single-arch image per (service, arch) pair, each on a runner
  # native to that architecture — no QEMU emulation. `merge` below joins the
  # two per-arch images into the final multi-arch tags.
  build:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build context
        id: ctx
        run: |
          case "${{ matrix.service }}" in
            graph-service)
              echo "dockerfile=graph-service/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=./graph-service" >> $GITHUB_OUTPUT
              ;;
            dtek)
              echo "dockerfile=dtek-service/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=./dtek-service" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "dockerfile=Dockerfile.${{ matrix.service }}" >> $GITHUB_OUTPUT
              echo "context=." >> $GITHUB_OUTPUT
              ;;
          esac

      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.dockerfile }}
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}
          provenance: false
          sbom: false

  # Joins each service's amd64 + arm64 images (built above) into the final
  # multi-arch `latest` and `sha-<sha>` tags — no rebuild, just a manifest push.
  merge:
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest \
            -t ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }} \
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}-amd64 \
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}-arm64

  deploy:
    runs-on: ubuntu-latest
    needs: [changes, merge]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in manifests
        run: |
          SERVICES='${{ needs.changes.outputs.services }}'
          for service in $(echo "$SERVICES" | jq -r '.[]'); do
            sed -i "s|${{ env.IMAGE_PREFIX }}/$service:.*|${{ env.IMAGE_PREFIX }}/$service:sha-${{ github.sha }}|g" k8s/$service.yaml
            echo "Updated k8s/$service.yaml to sha-${{ github.sha }}"
          done

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git diff --cached --quiet || git commit -m "ci: update images to sha-${{ github.sha }}"
          git push
